kb_articles:
  - title: "Résoudre les problèmes de connexion VPN"
    tags: ["vpn", "réseau", "connexion", "certificat"]
    content: |
      # Résoudre les problèmes de connexion VPN

      ## Symptômes courants
      - Erreur d'authentification au démarrage
      - Connexion qui se coupe après quelques minutes
      - Impossible de joindre les ressources internes

      ## Solutions

      ### 1. Vérifier le certificat
      Ouvrez les Préférences Système > Réseau > VPN > Avancé > Certificats. Si le certificat est expiré, contactez le support pour en obtenir un nouveau.

      ### 2. Réinitialiser le mot de passe VPN
      Rendez-vous sur le portail RH > Mon compte > Réinitialiser mot de passe VPN.

      ### 3. Réinstaller le client VPN
      Désinstallez GlobalProtect, redémarrez, puis réinstallez depuis le portail IT.

  - title: "Réinitialiser son mot de passe Active Directory"
    tags: ["mot de passe", "active directory", "authentification", "accès"]
    content: |
      # Réinitialiser son mot de passe Active Directory

      ## Depuis Windows
      1. Sur l'écran de connexion, cliquez sur **Je n'arrive pas à me connecter**
      2. Sélectionnez **Réinitialiser mon mot de passe**
      3. Vérifiez votre identité via votre email de récupération

      ## Depuis le portail web
      1. Rendez-vous sur https://password.entreprise.com
      2. Entrez votre identifiant réseau
      3. Suivez les étapes de vérification

      ## Règles du mot de passe
      - Minimum 12 caractères
      - Au moins 1 majuscule, 1 chiffre, 1 caractère spécial
      - Ne peut pas reprendre les 5 derniers mots de passe

  - title: "Procédure de démarrage d'un nouveau poste de travail"
    tags: ["onboarding", "poste de travail", "configuration", "nouveau arrivant"]
    content: |
      # Procédure de démarrage d'un nouveau poste de travail

      ## Étapes initiales
      1. Connectez le poste au réseau filaire (le Wi-Fi sera configuré après)
      2. Allumez et attendez l'écran de configuration Windows
      3. Entrez vos identifiants réseau (format : prenom.nom)

      ## Logiciels à installer en priorité
      - **VPN** : téléchargez GlobalProtect depuis https://vpn.entreprise.com
      - **Antivirus** : s'installe automatiquement après connexion au réseau
      - **Office 365** : portail https://office.entreprise.com

      ## En cas de problème
      Contactez le support IT via le portail ou appelez le 1234.

